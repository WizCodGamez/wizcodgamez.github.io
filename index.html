<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WizCod Gamez</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">

    
</head>


<body>


    <!-- =========================================
         HERO / HEADER
    ========================================= -->

    <header class="hero">

        <div class="hero-content">


            <!-- LOGO -->

            <a href="/" class="logo-link">

                <img
                    src="WizCodGamez_Logo.png"
                    alt="WizCod Gamez"
                    class="logo"
                >

            </a>


            <!-- HEADING -->

            <h1>
                “Keep calm and game on”
            </h1>


            <!-- SUBTITLE -->

            <p class="subtitle">
                Check our collection of games
            </p>


            <!-- BUTTON -->

            <a
                href="#games"
                class="cta-button"
            >
                Check it now
            </a>


            <!-- NAVIGATION -->

            <nav class="navigation">

                <a href="/">
                    Home
                </a>

               <a href="#games" class="games-link"> Games <span class="arrow">⌄</span></a>

                <a href="#projects">
                    Projects
                </a>

                <a href="#contact">
                    Contact
                </a>

                <a href="#privacy">
                    Privacy Policy
                </a>

            </nav>


        </div>

    </header>

    <section class="games-section" id="games">

    <div class="games-header">
        <h2>Adventure Games</h2>
        <p>Explore our collection of adventure games</p>
    </div>

    <div class="games-grid">

        <!-- Cross Tracks 3D -->
        <div class="game-card">
            <div class="game-image">
                <img src="CrossTracks3D/CrossTracks3D.png" alt="Cross Tracks 3D">
            </div>

            <div class="game-info">
                <h3>Cross Tracks 3D</h3>
                <p>Adventure</p>

                <div class="game-bottom">
                    <span class="game-price">Free</span>

                    <a href="#" class="game-button">
                        View Game
                    </a>
                </div>
            </div>
        </div>


        <!-- Ice Runner -->
        <div class="game-card">
            <div class="game-image">
                <img src="IceRunner/IceRunner.png" alt="Ice Runner">
            </div>

            <div class="game-info">
                <h3>Ice Runner</h3>
                <p>Adventure</p>

                <div class="game-bottom">
                    <span class="game-price">Free</span>

                    <a href="#" class="game-button">
                        View Game
                    </a>
                </div>
            </div>
        </div>

    </div>

</section>


</body>

</html>
